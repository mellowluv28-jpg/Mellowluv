<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Mellowluv | Test Website</title>
  <link rel="icon" href="/public/icons/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/test-website/assets/css/test-site.css">
</head>
<body class="tw-body" data-page="cart">
  <div id="tw-header-mount"></div>

  <main class="tw-page-main">
    <section class="tw-container">
      <div class="tw-confirm-hero">
        <div class="tw-success-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
        </div>
        <h1>Thank you — preview confirmed.</h1>
        <p>Your simulated order is saved in this browser. No payment was taken and nothing was sent to the live Mellowluv store.</p>
      </div>

      <div id="tw-confirm-root" style="margin-top:18px;">
        <div class="tw-loading">Finding your preview order…</div>
      </div>
    </section>

    <div class="tw-torn-wrap" aria-hidden="true">
      <svg viewBox="0 0 1200 30" preserveAspectRatio="none">
        <path d="M0 30V16c25-8 50-8 75 0s50 8 75 0 50-8 75 0 50 8 75 0 50-8 75 0 50 8 75 0 50-8 75 0 50 8 75 0 50-8 75 0 50 8 75 0 50-8 75 0 50 8 75 0 50-8 75 0 50 8 75 0 50-8 75 0 50 8 75 0 50-8 75 0 25 4 30 6V30Z"/>
      </svg>
    </div>
  </main>

  <div id="tw-footer-mount"></div>

  <script src="/test-website/assets/js/test-site.js"></script>
  <script>
    TW.ready(function () {
      var root = document.getElementById('tw-confirm-root');
      var params = new URLSearchParams(window.location.search);
      var wanted = params.get('order');
      var orders = TW.getOrders();
      var order = wanted
        ? orders.filter(function (o) { return o.id.toLowerCase() === wanted.toLowerCase(); })[0]
        : orders[0];

      if (!order) {
        root.innerHTML =
          '<div class="tw-panel tw-cart-empty">' +
            '<span class="tw-deco" data-tw-deco="bloom" aria-hidden="true"></span>' +
            '<h3>No preview order found</h3>' +
            '<p>Complete a preview checkout to see a confirmation here, or look up the sample order on the tracking page.</p>' +
            '<a class="tw-btn tw-btn--plum" href="/test-website/collection">Explore the collection</a>' +
            '<a class="tw-btn tw-btn--ghost" href="/test-website/tracking" style="margin-top:8px;">View sample tracking</a>' +
          '</div>';
        TW.mountDecos();
        return;
      }

      var placed = new Date(order.createdAt);
      var items = order.items.map(function (item) {
        var note = order.notes && order.notes[item.id];
        return '<div class="tw-order-mini">' +
          '<img src="' + TW.cld(item.image, 160) + '" alt="' + TW.esc(item.name) + '">' +
          '<div><div class="tw-om-name">' + TW.esc(item.name) + ' × ' + item.qty + '</div>' +
          (note ? '<div class="tw-cart-item-note">Note: ' + TW.esc(note) + '</div>' : '') +
          '</div>' +
          '<span class="tw-om-price">' + TW.money(item.price * item.qty) + '</span>' +
        '</div>';
      }).join('');

      root.innerHTML =
        '<div class="tw-confirm-grid">' +
          '<div class="tw-order-card">' +
            '<div class="tw-order-head">' +
              '<div><div class="tw-order-id">' + TW.esc(order.id) + '</div><div class="tw-order-date">Placed ' + placed.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' }) + '</div></div>' +
              '<span class="tw-preview-badge" style="margin:0;">Preview order</span>' +
            '</div>' +
            items +
            '<div class="tw-summary-list" style="margin-top:12px;">' +
              '<div class="tw-summary-row"><span>Subtotal</span><span>' + TW.money(order.subtotal) + '</span></div>' +
              '<div class="tw-summary-row"><span>Shipping</span><span>' + TW.money(order.shipping) + '</span></div>' +
              (order.urgentFee ? '<div class="tw-summary-row"><span>Urgent making</span><span>' + TW.money(order.urgentFee) + '</span></div>' : '') +
              '<div class="tw-summary-row tw-total"><span>Total</span><span>' + TW.money(order.total) + '</span></div>' +
            '</div>' +
            '<div class="tw-note-card tw-note-card--olive" style="margin-top:12px;font-size:11.5px;">' +
              '<b>Delivery details</b><br>' +
              TW.esc(order.customer.name) + ' · ' + TW.esc(order.customer.phone) + '<br>' +
              TW.esc(order.customer.house) + ', ' + TW.esc(order.customer.street) + '<br>' +
              TW.esc(order.customer.city) + ', ' + TW.esc(order.customer.state) + ' — ' + TW.esc(order.customer.pincode) +
            '</div>' +
            (order.screenshotName
              ? '<p class="tw-note" style="margin-top:10px;">Screenshot previewed: ' + TW.esc(order.screenshotName) + ' (not uploaded anywhere).</p>'
              : '<p class="tw-note" style="margin-top:10px;">No screenshot was selected — this is a simulated confirmation.</p>') +
            '<div class="tw-note-card" style="margin-top:10px;font-size:11px;">' +
              '<b>Want to see it again?</b> This order is stored only in this browser. Use the order ID above on the tracking page.' +
            '</div>' +
          '</div>' +

          '<aside>' +
            '<div class="tw-panel">' +
              '<h3 style="font-size:22px;">Order timeline</h3>' +
              TW.timelineHTML(1) +
            '</div>' +
            '<div class="tw-panel">' +
              '<h3 style="font-size:22px;">What happens next?</h3>' +
              '<p style="font-size:12.5px;color:#5b4850;line-height:1.7;">On the live store, your screenshot would be checked by hand. Once verified, making begins. You can follow each stage on the tracking page.</p>' +
              '<a class="tw-btn tw-btn--plum tw-btn--block" href="/test-website/tracking?order=' + encodeURIComponent(order.id) + '" style="margin-top:12px;">Track this order</a>' +
              '<a class="tw-btn tw-btn--ghost tw-btn--block" href="/test-website/collection" style="margin-top:8px;">Continue shopping</a>' +
            '</div>' +
            '<div class="tw-note-card tw-note-card--plum" style="font-size:11px;">' +
              '<b>Privacy:</b> the name, phone and address entered during this preview are saved only in this browser and never transmitted to Mellowluv.' +
            '</div>' +
          '</aside>' +
        '</div>';
    });
  </script>
</body>
</html>
